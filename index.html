<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deltarune: Traktor vs Jevil</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; user-select: none; }
        #game { position: relative; width: 640px; height: 480px; border: 4px solid white; background: #111; overflow: hidden; }
        
        /* КРУТЯЩИЙСЯ 3D-ФОН ДЖЕВИЛА */
        #jevil-bg { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: repeating-linear-gradient(45deg, #0b003a, #0b003a 30px, #1a0066 30px, #1a0066 60px); z-index: 1; transform: perspective(300px) rotateX(60deg) rotateZ(0deg); animation: spin 12s linear infinite; }
        @keyframes spin { from { transform: perspective(300px) rotateX(60deg) rotateZ(0deg); } to { transform: perspective(300px) rotateX(60deg) rotateZ(360deg); } }
        
        /* Персонажи */
        .char { position: absolute; z-index: 10; max-height: 110px; }
        #hero1 { top: 80px; left: 110px; } #hero2 { top: 160px; left: 100px; } #hero3 { top: 240px; left: 120px; } #boss { top: 120px; right: 80px; }
        
        /* Шкала TP */
        #tp-box { position: absolute; left: 15px; top: 40px; z-index: 30; text-align: center; color: white; font-weight: bold; }
        #tp-bar { width: 16px; height: 150px; background: #222; border: 2px solid white; position: relative; margin-top: 5px; }
        #tp-fill { position: absolute; bottom: 0; width: 100%; height: 20%; background: linear-gradient(to top, red, orange); transition: height 0.3s; }
        
        /* Плашки здоровья */
        #ui { position: absolute; bottom: 115px; left: 10px; width: 620px; display: flex; z-index: 20; background: black; border-top: 3px solid #00ffff; padding-top: 5px; }
        .card { width: 33%; color: white; font-size: 14px; padding: 2px 10px; border-right: 2px solid #222; }
        .card.active b { color: #00ffff; }
        .hp-bg { width: 100%; height: 10px; background: #400000; margin-top: 4px; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.3s; }
        
        /* Кнопки меню */
        #menu { position: absolute; bottom: 75px; left: 20px; display: flex; gap: 8px; z-index: 25; }
        .btn { border: 2px solid #555; padding: 3px 10px; color: #aaa; font-weight: bold; font-size: 13px; background: black; display: flex; gap: 6px; }
        .btn.selected { border-color: #ff8000; color: #ff8000; }
        
        /* Рамка для диалогов из Paint */
        #dialogue-box-bg { position: absolute; bottom: 10px; left: 10px; width: 612px; height: 60px; z-index: 18; }
        #dialogue { position: absolute; bottom: 10px; left: 10px; width: 612px; height: 60px; z-index: 20; color: white; padding: 5px 15px; box-sizing: border-box; font-size: 18px; }
    </style>
</head>
<body>
    <div id="game">
        <div id="jevil-bg"></div>
        <div id="tp-box">T<br>P<br><span id="tp-lbl" style="font-size:12px;">20%</span><div id="tp-bar"><div id="tp-fill"></div></div></div>
        
        <!-- Картинки твоих персонажей -->
        <img id="hero1" class="char" src="traktor.png" alt="Traktor">
        <img id="hero2" class="char" src="pon.png" alt="Pon">
        <img id="hero3" class="char" src="zhirny.png" alt="Zhirny">
        <img id="boss" class="char" src="jevil.png" alt="Jevil">
        <img id="dialogue-box-bg" src="box.png" alt="Box">

        <div id="ui">
            <div id="c1" class="card active"><div><b>TRAKTOR</b> <span style="float:right; font-size:11px;">HP 120/120</span></div><div class="hp-bg"><div class="hp-fill" style="height:100%; width:100%; background:#00ffff"></div></div></div>
            <div id="c2" class="card"><div><b>PON</b> <span style="float:right; font-size:11px;">HP 90/90</span></div><div class="hp-bg"><div class="hp-fill" style="height:100%; width:100%; background:#ff00ff"></div></div></div>
            <div id="c3" class="card"><div><b>ZHIRNY</b> <span style="float:right; font-size:11px;">HP 140/140</span></div><div class="hp-bg"><div class="hp-fill" style="height:100%; width:100%; background:#00ff00"></div></div></div>
        </div>
        <div id="menu">
            <div id="b0" class="btn selected">⚔️ FIGHT</div><div id="b1" class="btn">🧡 ACT</div><div id="b2" class="btn">💼 ITEM</div><div id="b3" class="btn">🛡️ DEFEND</div><div id="b4" class="btn">💕 MERCY</div>
        </div>
        <div id="dialogue"><span id="txt"></span></div>
    </div>

    <script>
        const btns = [document.getElementById('b0'), document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3'), document.getElementById('b4')];
        let sel = 0, turn = 1, idx = 0, msg = "* TRAKTOR готов к бою! Что выберешь?", typing = false;
        
        function type() {
            if (idx < msg.length) { typing = true; document.getElementById('txt').innerHTML += msg.charAt(idx++); setTimeout(type, 25); } 
            else { typing = false; }
        }

        // Бронебойное управление, которое ловит KeyZ и стрелочки в любом режиме
        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowLeft" || e.key === "ArrowLeft") { btns[sel].classList.remove('selected'); sel = (sel - 1 + 5) % 5; btns[sel].classList.add('selected'); }
            if (e.code === "ArrowRight" || e.key === "ArrowRight") { btns[sel].classList.remove('selected'); sel = (sel + 1) % 5; btns[sel].classList.add('selected'); }
            
            if (e.code === "KeyZ" || e.key.toLowerCase() === "z" || e.key.toLowerCase() === "я") {
                if (typing) { idx = msg.length; document.getElementById('txt').innerHTML = msg; typing = false; return; }
                let act = btns[sel].innerText;
                if (turn === 1) { msg = `* TRAKTOR выбрал [${act}]. Ход монстра PON!`; turn = 2; document.getElementById('c1').classList.remove('active'); document.getElementById('c2').classList.add('active'); }
                else if (turn === 2) { msg = `* PON выбрал [${act}]. Ход ZHIRNY!`; turn = 3; document.getElementById('c2').classList.remove('active'); document.getElementById('c3').classList.add('active'); }
                else if (turn === 3) { 
                    msg = `* JEVIL зловеще хохочет: "ХАОС, ХАОС!" Накапливаем TP!`; turn = 1; document.getElementById('c3').classList.remove('active'); document.getElementById('c1').classList.add('active');
                    let tp = Math.min(parseInt(document.getElementById('tp-lbl').innerText) + 25, 100);
                    document.getElementById('tp-lbl').innerText = tp + '%'; document.getElementById('tp-fill').style.height = tp + '%';
                }
                document.getElementById('txt').innerHTML = ""; idx = 0; type();
            }
        });
        type();
    </script>
</body>
</html>
